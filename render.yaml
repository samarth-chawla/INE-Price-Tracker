# Render Blueprint for the INE Tracker backend.
# Apply via Render Dashboard → New → Blueprint → point at the repo.
# Secrets are entered in the Render dashboard (never in this file).
services:
  - type: web
    name: ine-tracker-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    # Starter (not free): headless Chromium needs the RAM, and the 2-hour
    # cron must not hit a sleeping free instance.
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: SUPABASE_CONNECTION_STRING
        sync: false # pooler URI (postgres://…) — paste in dashboard
      - key: SCRAPE_RUN_TOKEN
        sync: false # fresh long random value — paste in dashboard
      - key: FRONTEND_URL
        sync: false # e.g. https://ine-tracker-frontend.vercel.app
